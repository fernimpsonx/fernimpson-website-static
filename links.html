<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Links | Fern Impson</title>
  <style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Jost',sans-serif;background:#F2E5DE;min-height:100vh;overflow-x:hidden;}
  .fi-header{background:#FAF7F4;display:flex;flex-direction:column;align-items:center;padding:52px 24px 40px;width:100%;}
  .fi-header__avatar{width:110px;height:110px;border-radius:50%;object-fit:cover;object-position:center top;border:2px solid #B9968D;margin-bottom:20px;}
  .fi-header__name{font-family:'Jost',sans-serif;font-size:15px;font-weight:400;letter-spacing:0.22em;color:#2F2F2F;text-transform:uppercase;text-align:center;margin-bottom:10px;}
  .fi-header__tagline{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:20px;color:#6C403E;text-align:center;}
  .fi-burg{color:#6C403E;}
  .fi-cg{color:#6C403E;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;}
  .fi-body{background:#F2E5DE;width:100%;display:flex;flex-direction:column;align-items:center;padding:48px 24px 64px;max-width:520px;margin:0 auto;}
  .fi-label{font-family:'Jost',sans-serif;font-size:12px;font-weight:400;letter-spacing:0.22em;color:#6C403E;text-transform:uppercase;text-align:center;margin-bottom:16px;}
  .fi-title{font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:400;color:#2F2F2F;text-align:center;line-height:1.2;margin-bottom:32px;}
  .fi-title em{color:#6C403E;font-style:italic;}
  .fi-text{font-family:'Jost',sans-serif;font-size:16px;font-weight:300;line-height:1.8;color:#2F2F2F;text-align:center;margin-bottom:20px;}
  .fi-text em{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:19px;color:#6C403E;}
  .fi-closing{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;color:#6C403E;text-align:center;margin-top:8px;margin-bottom:40px;}
  .fi-heart{width:18px;height:18px;fill:#6C403E;flex-shrink:0;}
  .fi-btn{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:420px;background:#fff;border:none;border-radius:50px;padding:18px 28px;margin-bottom:16px;text-decoration:none;cursor:pointer;transition:background 0.2s ease,transform 0.15s ease;}
  .fi-btn:hover{background:#f5ede9;transform:translateY(-1px);}
  .fi-btn__text{font-family:'Jost',sans-serif;font-size:14px;font-weight:400;letter-spacing:0.05em;color:#2F2F2F;text-align:left;flex:1;}
  .fi-btn__badge{font-family:'Jost',sans-serif;font-size:10px;font-weight:500;letter-spacing:0.12em;color:#fff;background:#6C403E;border-radius:20px;padding:4px 12px;text-transform:uppercase;margin-left:14px;white-space:nowrap;}
  .fi-input{width:100%;background:#fff;border:none;border-radius:50px;padding:18px 28px;font-family:'Jost',sans-serif;font-size:15px;font-weight:300;color:#2F2F2F;letter-spacing:0.05em;outline:none;margin-bottom:14px;}
  .fi-input::placeholder{color:#B9968D;}
  .fi-submit{width:100%;background:#6C403E;border:none;border-radius:50px;padding:18px 28px;font-family:'Jost',sans-serif;font-size:13px;font-weight:500;letter-spacing:0.18em;color:#fff;text-transform:uppercase;cursor:pointer;transition:background 0.2s ease;}
  .fi-submit:hover{background:#65081F;}
  .fi-footer{margin-top:48px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;}
  .fi-footer__link{display:flex;align-items:center;gap:8px;text-decoration:none;}
  .fi-footer span{font-family:'Jost',sans-serif;font-size:13px;font-weight:300;letter-spacing:0.12em;color:#6C403E;}
  .fi-form{width:100%;max-width:420px;display:flex;flex-direction:column;margin-top:8px;}
  @media(max-width:480px){.fi-body{padding:40px 20px 56px;}.fi-title{font-size:36px;}}
</style>
</head>
