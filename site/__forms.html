<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Form definitions</title><meta name="robots" content="noindex,nofollow"></head>
<body>
<!-- Static Netlify form definitions. Netlify scans this file at deployment.
     These are intentionally not linked or shown to visitors. -->
<form name="confidence-quiz" method="POST" action="/__forms.html" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="confidence-quiz">
  <input type="text" name="bot-field">
  <input type="text" name="first-name">
  <input type="email" name="email">
  <input type="text" name="result">
  <input type="text" name="submitted-at">
  <input type="text" name="consent-wording">
  <input type="text" name="marketing-consent">
</form>
<form name="confidence-challenge-waitlist" method="POST" action="/__forms.html" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="confidence-challenge-waitlist">
  <input type="text" name="bot-field">
  <input type="text" name="first-name">
  <input type="email" name="email">
  <input type="text" name="submitted-at">
  <input type="text" name="consent-wording">
</form>
</body>
</html>
