<style>
:root{
  --burgundy:#440915;--title:#6E1228;--charcoal:#23201F;--cream:#F7F3EE;--taupe:#B39A8B;--ivory:#F8F4EF;
  --serif:"DM Serif Display","Bodoni Moda",Didot,Georgia,"Times New Roman",serif;
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --gap-tight:8px;--gap-phrase:16px;--gap-group:32px;
  --gutter:clamp(1.5rem,6vw,5rem);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:calc(64px + env(safe-area-inset-top,0px));background:var(--charcoal);color:var(--ivory);font-family:var(--sans);font-size:1.0625rem;line-height:1.5;font-weight:400;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:clip}
p{margin:0}
h1,.brand,.ltitle{font-family:var(--serif);font-weight:400;margin:0;font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1}
.bar{position:fixed;top:0;left:0;right:0;z-index:50;background:var(--charcoal);height:calc(64px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);display:flex;align-items:center;justify-content:center;padding-right:max(var(--gutter),env(safe-area-inset-right,0px));padding-left:max(var(--gutter),env(safe-area-inset-left,0px))}
.brand{font-size:1.25rem;line-height:1;letter-spacing:.1em;text-transform:uppercase;color:var(--ivory)}
.hero{padding:16px max(var(--gutter),env(safe-area-inset-right,0px)) 0 max(var(--gutter),env(safe-area-inset-left,0px))}
.linkzone{padding:56px max(var(--gutter),env(safe-area-inset-right,0px)) 32px max(var(--gutter),env(safe-area-inset-left,0px));background:linear-gradient(180deg,var(--charcoal) 0%,#6B5A50 10%,#B7A496 22%,var(--cream) 36%)}
.col{max-width:30rem;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center}
.portrait{display:block;width:clamp(150px,44vw,184px);aspect-ratio:1/1;height:auto;border-radius:50%;object-fit:cover;margin-bottom:24px}
h1{font-size:clamp(1.625rem,1.35rem + 1.6vw,2.375rem);line-height:1.12;color:var(--ivory);text-wrap:balance;margin-bottom:16px}
h1 em{font-style:italic}
.real{text-transform:none}
.pillars{font-weight:500;font-size:.9375rem;letter-spacing:.24em;line-height:1.4;color:var(--taupe);margin-bottom:0}
.links{width:100%;display:flex;flex-direction:column;gap:12px;list-style:none;margin:0;padding:0}
.link{display:block;background:var(--burgundy);box-shadow:0 10px 24px -12px rgba(68,9,21,.55);color:var(--ivory);text-decoration:none;border-radius:20px;padding:18px 24px;text-align:center;transition:background-color .25s ease}
.link:hover{background:var(--title)}
.link:focus-visible{outline:2px solid var(--taupe);outline-offset:3px}
.lk{display:block;font-family:var(--sans);font-weight:500;font-size:clamp(1rem,.9rem + .5vw,1.1875rem);line-height:1.3;letter-spacing:.08em;color:var(--ivory);text-wrap:balance;margin-bottom:var(--gap-tight)}
.ltitle{display:block;font-family:var(--sans);font-size:.9375rem;line-height:1.4;color:rgba(248,244,239,.8);text-wrap:balance}
.arrow{margin-left:6px}
.foot{background:var(--charcoal);color:var(--ivory);display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px max(var(--gutter),env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(var(--gutter),env(safe-area-inset-left,0px))}
.social{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.social a{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;color:var(--ivory);border-radius:50%;transition:color .3s ease,background-color .3s ease}
.social a:hover{background:rgba(248,244,239,.12)}
.social a:focus-visible{outline:2px solid var(--taupe);outline-offset:2px}
.social svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.foot-name{font-family:var(--serif);font-size:1.0625rem;letter-spacing:.1em;line-height:1;margin:0}
.foot-privacy{font-family:var(--sans);font-size:.75rem;line-height:1.4;color:rgba(248,244,239,.72);text-decoration:underline;text-underline-offset:3px}.foot-privacy:hover,.foot-privacy:focus-visible{color:var(--ivory)}
@media (prefers-reduced-motion:reduce){.link{transition:none}}
</style>
